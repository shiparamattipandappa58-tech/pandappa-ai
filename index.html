<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandappa AI - ChatGPT Style</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #1e293b;
            --user-bubble: #2563eb;
            --bot-bubble: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Header */
        .header { padding: 12px 20px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h2 { font-size: 18px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .controls { display: flex; gap: 10px; }
        .btn-top { background: #334155; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-top:hover { background: #475569; }

        /* Chat Window */
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-break: break-word; position: relative; white-space: pre-wrap; }
        .user { align-self: flex-end; background-color: var(--user-bubble); color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background-color: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 2px; border: 1px solid #334155; }
        
        .action-bar { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; opacity: 0.8; }
        .action-btn { background: rgba(255,255,255,0.1); border: none; color: #38bdf8; padding: 3px 8px; border-radius: 4px; cursor: pointer; }

        /* Input Bar */
        .input-bar { padding: 12px 15px; background: #0f172a; display: flex; gap: 10px; border-top: 1px solid #334155; align-items: center; }
        input[type="text"] { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent); }
        
        .btn { padding: 12px 18px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; font-size: 14px; }
        .btn-send { background: #16a34a; }
        .btn-mic { background: #eab308; }
        .btn-mic.active { background: #dc2626; animation: pulse 1.5s infinite; }

        video { width: 100%; height: 120px; object-fit: cover; display: none; background: black; }
        canvas { display: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h2>🐼 Pandappa AI</h2>
        <div class="controls">
            <button class="btn-top" onclick="clearHistory()">🧹 Clear Chat</button>
            <button class="btn-top" id="speechToggle" onclick="toggleSpeech()">🔊 Voice: ON</button>
            <button class="btn-top" onclick="toggleCamera()">📷 Camera</button>
        </div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-bar">
        <button class="btn btn-mic" id="micBtn" onclick="toggleVoice()">🎙️ Voice</button>
        <input type="text" id="userInput" placeholder="ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ ಅಥವಾ ಮಾತನಾಡಿ..." onkeypress="if(event.key === 'Enter') sendQuery()">
        <button class="btn btn-send" onclick="sendQuery()">Send</button>
    </div>

    <canvas id="snapshotCanvas"></canvas>

    <script>
        let isListening = false;
        let speechEnabled = true;
        let isProcessing = false;
        let recognition = null;
        let videoStream = null;
        let lastUserQuery = "";

        // Load History on Page Start
        window.onload = () => {
            loadHistory();
        };

        // Speech Recognition Setup
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'kn-IN';

            recognition.onresult = (e) => {
                if (isProcessing) return;
                const txt = e.results[e.results.length - 1][0].transcript.trim();
                if (txt) sendQuery(txt);
            };

            recognition.onend = () => {
                if (isListening) try { recognition.start(); } catch(err){}
            };
        }

        function toggleVoice() {
            const btn = document.getElementById('micBtn');
            if (!isListening) {
                try { recognition.start(); isListening = true; btn.classList.add('active'); } catch(e){}
            } else {
                isListening = false; recognition.stop(); btn.classList.remove('active');
            }
        }

        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            document.getElementById('speechToggle').innerText = speechEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
            if (!speechEnabled) window.speechSynthesis.cancel();
        }

        async function toggleCamera() {
            const v = document.getElementById('webcam');
            if (v.style.display === 'none' || !v.style.display) {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    v.srcObject = videoStream; v.style.display = 'block';
                } catch(e) { alert("Camera Error: " + e); }
            } else {
                if(videoStream) videoStream.getTracks().forEach(t => t.stop());
                v.style.display = 'none';
            }
        }

        function captureFrame() {
            const v = document.getElementById('webcam');
            if (v.style.display === 'none') return null;
            const c = document.getElementById('snapshotCanvas');
            c.width = 320; c.height = 240;
            c.getContext('2d').drawImage(v, 0, 0, 320, 240);
            return c.toDataURL('image/jpeg', 0.5);
        }

        async function sendQuery(overrideText = null) {
            const input = document.getElementById('userInput');
            const txt = overrideText || input.value.trim();
            if (!txt || isProcessing) return;

            lastUserQuery = txt;
            if (!overrideText) input.value = '';
            
            appendMsg(txt, 'user');
            saveHistory();
            isProcessing = true;

            const botElem = appendMsg("🤔 Pandappa ಆಲೋಚಿಸುತ್ತಿದೆ...", 'bot');
            const img = captureFrame();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: txt, image: img })
                });
                const data = await res.json();
                const reply = data.response || "ಉತ್ತರ ಸಿಗಲಿಲ್ಲ.";

                botElem.innerText = reply;
                addActionBar(botElem, reply);
                saveHistory();

                if (speechEnabled) speak(reply);

            } catch(e) {
                botElem.innerText = "❌ ಸರ್ವರ್ ಸಂಪರ್ಕದಲ್ಲಿ ತೊಂದರೆಯಾಗಿದೆ.";
            } finally {
                isProcessing = false;
            }
        }

        function appendMsg(txt, cls) {
            const b = document.getElementById('chatBox');
            const d = document.createElement('div');
            d.className = `msg ${cls}`;
            d.innerText = txt;
            b.appendChild(d);
            b.scrollTop = b.scrollHeight;
            return d;
        }

        function addActionBar(elem, text) {
            const bar = document.createElement('div');
            bar.className = 'action-bar';
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-btn';
            copyBtn.innerText = '📋 Copy';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(text);
                copyBtn.innerText = '✅ Copied!';
                setTimeout(() => copyBtn.innerText = '📋 Copy', 2000);
            };

            const regenBtn = document.createElement('button');
            regenBtn.className = 'action-btn';
            regenBtn.innerText = '🔄 Regenerate';
            regenBtn.onclick = () => {
                if (lastUserQuery) sendQuery(lastUserQuery);
            };

            bar.appendChild(copyBtn);
            bar.appendChild(regenBtn);
            elem.appendChild(bar);
        }

        function speak(text) {
            if ('speechSynthesis' in window && text) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'kn-IN';
                window.speechSynthesis.speak(u);
            }
        }

        function saveHistory() {
            const chatBox = document.getElementById('chatBox');
            localStorage.setItem('pandappa_history', chatBox.innerHTML);
        }

        function loadHistory() {
            const chatBox = document.getElementById('chatBox');
            const saved = localStorage.getItem('pandappa_history');
            if (saved) {
                chatBox.innerHTML = saved;
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                appendMsg("ನಮಸ್ಕಾರ! ನಾನು Pandappa AI. ಕೆಳಗೆ ಟೈಪ್ ಮಾಡಿ ಅಥವಾ Voice ಮೂಲಕ ಕನ್ನಡ ಮತ್ತು ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ಪ್ರಶ್ನೆ ಕೇಳಿ.", 'bot');
            }
        }

        function clearHistory() {
            localStorage.removeItem('pandappa_history');
            document.getElementById('chatBox').innerHTML = '';
            appendMsg("ಚಾಟ್ ಇತಿಹಾಸವನ್ನು ಡಿಲೀಟ್ ಮಾಡಲಾಗಿದೆ. ಹೊಸ ಪ್ರಶ್ನೆ ಕೇಳಿ!", 'bot');
        }
    </script>
</body>
</html>
