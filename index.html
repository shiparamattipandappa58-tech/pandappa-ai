<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandappa AI - Chat Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#131314] text-[#e3e3e3] font-sans h-screen flex overflow-hidden">

    <div id="sidebar" class="bg-[#1e1f20] w-64 flex flex-col justify-between p-3 transition-all duration-300 fixed md:relative z-30 h-full -translate-x-full md:translate-x-0">
        <div>
            <button onclick="startNewChat()" class="flex items-center gap-3 bg-[#282a2c] hover:bg-[#333538] text-sm text-[#e3e3e3] px-4 py-3 rounded-full w-full transition mb-6 shadow-sm">
                <i class="fa-solid fa-plus"></i>
                <span class="font-medium">ಹೊಸ ಚಾಟ್ (New Chat)</span>
            </button>

            <div class="text-xs font-semibold text-gray-400 mb-2 px-2">ಇತ್ತೀಚಿನ ಚಾಟ್‌ಗಳು</div>
            <div id="chatHistory" class="flex flex-col gap-1 overflow-y-auto max-h-[calc(100vh-200px)]">
                <div class="text-sm text-gray-300 bg-[#282a2c] px-3 py-2 rounded-lg truncate cursor-pointer">Pandappa AI ಪರಿಚಯ</div>
            </div>
        </div>

        <div class="border-t border-gray-700 pt-3 flex items-center gap-3 px-2">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white">P</div>
            <div class="text-sm font-medium">Pandappa User</div>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-full bg-[#131314] relative">
        
        <header class="flex items-center justify-between p-4 border-b border-[#282a2c] bg-[#131314]">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white text-lg">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="text-lg font-semibold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">Pandappa AI</h1>
            </div>
            <div class="text-xs bg-[#282a2c] text-gray-300 px-3 py-1.5 rounded-full border border-gray-700">
                <i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> AI Active
            </div>
        </header>

        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-6 max-w-4xl mx-auto w-full">
            <div class="flex flex-col items-center justify-center h-full text-center my-auto" id="welcomeScreen">
                <h2 class="text-3xl md:text-4xl font-bold text-gray-200 mb-2">ನಮಸ್ಕಾರ, ನಾನು ಪಾಂಡಪ್ಪ ಎಐ</h2>
                <p class="text-gray-400 text-sm md:text-base">ಇಂದಿನ ನಿಮ್ಮ ಪ್ರಶ್ನೆ ಅಥವಾ ಸಹಾಯವೇನು?</p>
            </div>
        </div>

        <div class="p-4 bg-[#131314] max-w-4xl mx-auto w-full">
            <div class="bg-[#1e1f20] rounded-2xl p-3 flex items-center gap-3 border border-transparent focus-within:border-gray-500 transition shadow-lg">
                <textarea id="userInput" rows="1" placeholder="ಇಲ್ಲಿ ಸಂದೇಶ ಟೈಪ್ ಮಾಡಿ..." class="flex-1 bg-transparent text-white outline-none resize-none max-h-32 text-sm md:text-base px-2"></textarea>
                <button onclick="sendMessage()" class="bg-white text-black hover:bg-gray-200 w-10 h-10 rounded-full flex items-center justify-center transition disabled:opacity-40" id="sendBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <p class="text-[11px] text-center text-gray-500 mt-2">ಜೆಮಿನಿ ಹಾಗೂ ಚಾಟ್‌ಜಿಪಿಟಿ ಮಾದರಿಯ ರೆಸ್ಪಾನ್ಸಿವ್ ವೆಬ್ ಇಂಟರ್‌ಫೇಸ್.</p>
        </div>

    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const sidebar = document.getElementById('sidebar');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
        }

        function startNewChat() {
            chatContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center my-auto" id="welcomeScreen">
                    <h2 class="text-3xl md:text-4xl font-bold text-gray-200 mb-2">ನಮಸ್ಕಾರ, ನಾನು ಪಾಂಡಪ್ಪ ಎಐ</h2>
                    <p class="text-gray-400 text-sm md:text-base">ಇಂದಿನ ನಿಮ್ಮ ಪ್ರಶ್ನೆ ಅಥವಾ ಸಹಾಯವೇನು?</p>
                </div>
            `;
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Remove welcome screen if present
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            // Append User Message
            const userMsgHTML = `
                <div class="flex items-start gap-3 justify-end">
                    <div class="bg-[#282a2c] text-white px-4 py-3 rounded-2xl max-w-[80%] text-sm md:text-base shadow-sm">
                        ${text}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white shrink-0">U</div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', userMsgHTML);
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Simulate AI Loading Response
            setTimeout(() => {
                const aiMsgHTML = `
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center font-bold text-white shrink-0"><i class="fa-solid fa-brain text-xs"></i></div>
                        <div class="bg-[#1e1f20] text-gray-200 px-4 py-3 rounded-2xl max-w-[80%] text-sm md:text-base shadow-sm border border-gray-800">
                            ನಿಮ್ಮ ಪ್ರಶ್ನೆಗೆ ಧನ್ಯವಾದಗಳು! ನಿಮ್ಮ ಸರ್ವರ್ ಕೋಡ್ (`Server.py`) ಜೊತೆ ಸಂಪರ್ಕ ಸಾಧಿಸಿ ಇದನ್ನು ಲೈವ್ ಮಾಡಬಹುದು.
                        </div>
                    </div>
                `;
                chatContainer.insertAdjacentHTML('beforeend', aiMsgHTML);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }

        // Enter key support
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
