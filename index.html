<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಪಾಂಡಪ್ಪ ಎಐ - Pandappa AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #3498db;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #ecf0f1;
            color: #2c3e50;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background-color: #fff;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        .chat-input-area button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">ಪಾಂಡಪ್ಪ ಎಐ (Pandappa AI)</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">ನಮಸ್ಕಾರ! ನಾನು ಪಾಂಡಪ್ಪ ಎಐ. ಇಂದು ನಾನು ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಲಿ?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="ಇಲ್ಲಿ ಸಂದೇಶ ಟೈಪ್ ಮಾಡಿ..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">ಕಳುಹಿಸಿ</button>
    </div>
</div>

<script>
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function sendMessage() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        
        if (messageText === '') return;

        const chatMessages = document.getElementById('chatMessages');

        // User Message Add ಮಾಡಿ
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.textContent = messageText;
        chatMessages.appendChild(userDiv);

        inputField.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // AI ಪ್ರತಿಕ್ರಿಯೆ
        setTimeout(() => {
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.textContent = getAIResponse(messageText);
            chatMessages.appendChild(aiDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 600);
    }

    function getAIResponse(query) {
        query = query.toLowerCase();
        if (query.includes('ಹೆಸರು') || query.includes('name')) {
            return "ನನ್ನ ಹೆಸರು ಪಾಂಡಪ್ಪ ಎಐ (Pandappa AI).";
        } else if (query.includes('ಹೇಗಿದ್ದೀರಾ') || query.includes('how are you')) {
            return "ನಾನು ಚೆನ್ನಾಗಿದ್ದೇನೆ! ಧನ್ಯವಾದಗಳು. ನಿಮಗೆ ಏನು ಸಹಾಯ ಬೇಕು?";
        } else if (query.includes('ಯಾರು ಸೃಷ್ಟಿಸಿದ್ದು') || query.includes('creator')) {
            return "ನನ್ನನ್ನು ಪಾಂಡಪ್ಪ ಡಿ. ಶಿಪರಮಟ್ಟಿ ಅವರು ಸೃಷ್ಟಿಸಿದ್ದಾರೆ!";
        } else {
            return "ನಿಮ್ಮ ಪ್ರಶ್ನೆಗೆ ಧನ್ಯವಾದಗಳು. ಇದು ಎಪಿಐ ಕೀ ಇಲ್ಲದೆ ಗಿಥಬ್‌ನಲ್ಲಿ ರನ್ ಆಗುತ್ತಿದೆ!";
        }
    }
</script>

</body>
</html>
