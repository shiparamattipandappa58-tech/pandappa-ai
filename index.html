<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandappa AI - Real Voice & Text</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; }
        
        .header { padding: 15px; background: #1e293b; text-align: center; border-bottom: 1px solid #334155; }
        .wake-status { font-size: 13px; color: #38bdf8; margin-top: 5px; }

        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: #2563eb; color: white; }
        .bot { align-self: flex-start; background: #334155; color: white; }

        .controls { padding: 15px; background: #1e293b; display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; background: #0f172a; color: white; outline: none; }
        
        button { padding: 12px 18px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; }
        .btn-send { background: #38bdf8; color: #0f172a; }
        .btn-live { background: #22c55e; color: white; width: 100%; text-align: center; font-size: 16px; }
        .btn-live.active { background: #ef4444; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h2>Pandappa AI</h2>
        <div class="wake-status" id="wakeStatus">🎙️ "Hey Pandappa" ಎಂದು ಹೇಳಿ ಆಕ್ಟಿವೇಟ್ ಮಾಡಿ</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg bot">ನಮಸ್ಕಾರ! ನಾನು Pandappa AI. "Hey Pandappa" ಎಂದು ಕರೆದು ಮಾತಾಡಿ ಅಥವಾ ಟೈಪ್ ಮಾಡಿ.</div>
    </div>

    <div class="controls">
        <button class="btn-live" id="liveBtn" onclick="toggleLiveChat()">🔴 Live Continuous Voice Mode</button>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendText()">
            <button class="btn-send" onclick="sendText()">Send</button>
        </div>
    </div>

    <script>
        let isLive = false;
        let recognition = null;
        let isSpeaking = false;

        // Speech Recognition Setup
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'kn-IN'; // Kannada & English mix recognition

            recognition.onresult = async (event) => {
                if (isSpeaking) return;

                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log("Heard:", transcript);

                // Wake word trigger: "Hey Pandappa" or "Pandappa"
                if (transcript.toLowerCase().includes("pandappa") || transcript.toLowerCase().includes("ಪಾಂಡಪ್ಪ")) {
                    document.getElementById('wakeStatus').innerText = "⚡ Pandappa Listening...";
                    const query = transcript.replace(/hey/i, '').replace(/pandappa/i, '').replace(/ಪಾಂಡಪ್ಪ/i, '').trim();
                    if (query) {
                        processQuery(query);
                    } else {
                        speak("ಹೇಳಿ, ನಾನು ಕೇಳುತ್ತಿದ್ದೇನೆ.");
                    }
                } else if (isLive) {
                    processQuery(transcript);
                }
            };

            recognition.onend = () => {
                if (isLive) recognition.start();
            };
        }

        function toggleLiveChat() {
            const btn = document.getElementById('liveBtn');
            if (!isLive) {
                isLive = true;
                btn.classList.add('active');
                btn.innerText = "🛑 Stop Live Voice Mode";
                recognition.start();
                speak("ಲೈವ್ ವಾಯ್ಸ್ ಮೋಡ್ ಆನ್ ಆಗಿದೆ. ಮಾತಾಡಿ.");
            } else {
                isLive = false;
                btn.classList.remove('active');
                btn.innerText = "🔴 Live Continuous Voice Mode";
                recognition.stop();
            }
        }

        function sendText() {
            const input = document.getElementById('userInput');
            const txt = input.value.trim();
            if (txt) {
                input.value = '';
                processQuery(txt);
            }
        }

        async function processQuery(txt) {
            appendMsg(txt, 'user');
            const botMsg = appendMsg("ಆಲೋಚಿಸುತ್ತಿದೆ...", 'bot');

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: txt })
                });
                const data = await res.json();
                const reply = data.response || "ಉತ್ತರ ಸಿಗಲಿಲ್ಲ.";

                botMsg.innerText = reply;
                speak(reply);
            } catch(e) {
                botMsg.innerText = "❌ ಲೈವ್ ಸಂಪರ್ಕದಲ್ಲಿ ದೋಷ ಉಂಟಾಗಿದೆ.";
            }
        }

        function appendMsg(txt, cls) {
            const box = document.getElementById('chatBox');
            const d = document.createElement('div');
            d.className = `msg ${cls}`;
            d.innerText = txt;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
            return d;
        }

        function speak(text) {
            if ('speechSynthesis' in window && text) {
                isSpeaking = true;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'kn-IN';
                u.onend = () => {
                    isSpeaking = false;
                    document.getElementById('wakeStatus').innerText = '🎙️ "Hey Pandappa" ಎಂದು ಹೇಳಿ ಆಕ್ಟಿವೇಟ್ ಮಾಡಿ';
                };
                window.speechSynthesis.speak(u);
            }
        }
    </script>
</body>
</html>
