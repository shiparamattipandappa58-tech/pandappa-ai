<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandappa AI - Ultra Fast Offline AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header UI */
        header {
            background-color: #1e293b;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #38bdf8;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            color: #38bdf8;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* Chat Container */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #0284c7;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #1e293b;
            color: #f1f5f9;
            border-left: 4px solid #38bdf8;
            border-bottom-left-radius: 2px;
        }

        /* Input Area UI */
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #1e293b;
            gap: 10px;
            border-top: 1px solid #334155;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        #user-input:focus {
            border-color: #38bdf8;
        }

        #send-btn {
            padding: 12px 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #send-btn:hover {
            background-color: #0369a1;
        }

        /* Scrollbar Styling */
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>P A N D A P P A   A I</h1>
        <p>Real-Time Offline Intelligence • Gemini Style Web Engine</p>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            ನಮಸ್ಕಾರ! ನಾನು <b>Pandappa AI</b>. ನಿಮಗೇನು ಸಹಾಯ ಬೇಕು?
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ..." onkeypress="handleKeyPress(event)" />
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', className);
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';

            const aiMsgDiv = appendMessage('Pandappa AI ಯೋಚಿಸುತ್ತಿದೆ...', 'ai-message');

            try {
                // Ollama Local API Stream Connection
                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'Pandappa_AI',
                        prompt: text,
                        stream: false
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    aiMsgDiv.innerText = data.response;
                } else {
                    aiMsgDiv.innerText = 'Error: AI ಸಿಸ್ಟಮ್ ಸಂಪರ್ಕಿಸಲು ಸಾಧ್ಯವಾಗುತ್ತಿಲ್ಲ.';
                }
            } catch (error) {
                aiMsgDiv.innerText = 'Error: Ollama Server ಆನ್‌ಲೈನ್‌ನಲ್ಲಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ.';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
