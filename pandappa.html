<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಪಾಂಡಪ್ಪ AI - Pandappa AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1a73e8; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .quick-buttons { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background-color: #ffffff; border-bottom: 1px solid #ddd; }
        .btn { background-color: #e8f0fe; color: #1a73e8; border: 1px solid #aecbfa; border-radius: 20px; padding: 6px 12px; font-size: 0.85rem; white-space: nowrap; cursor: pointer; }
        .btn:active { background-color: #d2e3fc; }

        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-message { background-color: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background-color: #ffffff; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .loading { font-style: italic; color: #666; font-size: 0.85rem; margin-left: 15px; margin-bottom: 5px; display: none; }

        .input-container { display: flex; padding: 10px; background-color: #ffffff; border-top: 1px solid #ddd; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 0.95rem; }
        .icon-btn { background-color: #00a884; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
        .send-btn { background-color: #1a73e8; }
    </style>
</head>
<body>

    <header>ಪಾಂಡಪ್ಪ AI - Pandappa AI</header>

    <div class="quick-buttons">
        <button class="btn" onclick="quickAsk('⚡ ನಿನ್ನ ಸಾಮರ್ಥ್ಯಗಳೇನು?')">⚡ ಸಾಮರ್ಥ್ಯಗಳು</button>
        <button class="btn" onclick="quickAsk('✍️ ನನಗೆ ಒಂದು ಸುಂದರ ಕವನ ಬರೆದುಕೊಡು')">✍️ ಕವನ</button>
        <button class="btn" onclick="quickAsk('💻 ಜಾವಾಸ್ಕ್ರಿಪ್ಟ್‌ನಲ್ಲಿ ಹೆಲ್ಲೋ ವರ್ಲ್ಡ್ ಕೋಡ್ ನೀಡು')">💻 ಕೋಡಿಂಗ್ ಸಹಾಯ</button>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message bot-message">
            ನಮಸ್ಕಾರ! ನಾನು <b>ಪಾಂಡಪ್ಪ AI</b>.<br><br>ನಾನು ನಿಮಗಾಗಿ ಏನು ಬೇಕಾದರೂ ಮಾಡಲು ಸಿದ್ಧ. ಮೇಲಿರುವ ಬಟನ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಅಥವಾ ಕೆಳಗೆ ಪ್ರಶ್ನೆ ಟೈಪ್ ಮಾಡಿ!
        </div>
    </div>

    <div class="loading" id="loadingText">ಪಾಂಡಪ್ಪ AI ಯೋಚಿಸುತ್ತಿದೆ...</div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ ಅಥವಾ ಮಾತನಾಡಿ..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button class="icon-btn" onclick="startVoice()">🎙️</button>
        <button class="icon-btn send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        // ನಿಮ್ಮ API Key ಅನ್ನು ಇಲ್ಲಿ ಹಾಕಲಾಗಿದೆ
        const API_KEY = "AQ.Ab8RN6JWa-fOLffCqvnKID3AQbdu6t295Y6bJFfDqcWI3zNysQ"; 

        async function sendMessage(customText = null) {
            const inputField = document.getElementById('userInput');
            const messageText = customText || inputField.value.trim();
            if (!messageText) return;

            appendMessage(messageText, 'user-message');
            if (!customText) inputField.value = '';

            const loadingText = document.getElementById('loadingText');
            loadingText.style.display = 'block';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `ನೀನು 'ಪಾಂಡಪ್ಪ AI'. ಅತ್ಯಂತ ಚುರುಕಾದ ಕನ್ನಡ AI ಸಹಾಯಕ. ಬಳಕೆದಾರರಿಗೆ ತಕ್ಷಣವೇ ನೇರವಾದ ಮತ್ತು ಸ್ಪಷ್ಟವಾದ ಉತ್ತರವನ್ನು ಕನ್ನಡದಲ್ಲೇ ನೀಡು.\n\nಬಳಕೆದಾರರ ಪ್ರಶ್ನೆ: ${messageText}` }]
                        }]
                    })
                });

                const data = await response.json();
                loadingText.style.display = 'none';

                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'bot-message');
                } else if (data.error) {
                    appendMessage("API ದೋಷ: " + data.error.message, 'bot-message');
                } else {
                    appendMessage("ಕ್ಷಮಿಸಿ, ಉತ್ತರ ಪಡೆಯಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.", 'bot-message');
                }
            } catch (error) {
                loadingText.style.display = 'none';
                appendMessage("ಸಂಪರ್ಕ ದೋಷ! ದಯವಿಟ್ಟು ಇಂಟರ್ನೆಟ್ ಸಂಪರ್ಕ ಪರಿಶೀಲಿಸಿ.", 'bot-message');
            }
        }

        function quickAsk(text) {
            sendMessage(text);
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'kn-IN';
                recognition.start();

                recognition.onresult = function(event) {
                    document.getElementById('userInput').value = event.results[0][0].transcript;
                };
            } else {
                alert("ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ವಾಯ್ಸ್ ಇನ್‌ಪುಟ್ ಬೆಂಬಲಿಸುತ್ತಿಲ್ಲ.");
            }
        }
    </script>
</body>
</html>
